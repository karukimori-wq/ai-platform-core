name: Cloudflare Production
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  D1_DATABASE_ID: ${{ secrets.AI_PLATFORM_CORE_D1_DATABASE_ID }}
  PRODUCTION_URL: https://ai-platform-core.karukimori.workers.dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Require Cloudflare configuration
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$D1_DATABASE_ID"
      - name: Generate production Wrangler config
        working-directory: apps/cloudflare-worker
        run: |
          cat > wrangler.toml <<EOF
          name = "ai-platform-core"
          main = "src/index.ts"
          compatibility_date = "2026-08-24"
          [[d1_databases]]
          binding = "DB"
          database_name = "ai-platform-core"
          database_id = "$D1_DATABASE_ID"
          EOF
      - name: Verify Cloudflare identity and D1
        working-directory: apps/cloudflare-worker
        run: |
          pnpm exec wrangler whoami
          pnpm exec wrangler d1 info ai-platform-core
      - name: Apply D1 schema
        working-directory: apps/cloudflare-worker
        run: pnpm exec wrangler d1 execute ai-platform-core --remote --file=../../cloudflare/schema.sql --yes
      - name: Deploy Worker
        working-directory: apps/cloudflare-worker
        run: pnpm exec wrangler deploy
      - name: Verify production health and contracts
        run: |
          sleep 5
          curl --fail --silent --show-error "$PRODUCTION_URL/health" | tee /tmp/health.json
          curl --fail --silent --show-error "$PRODUCTION_URL/version" | tee /tmp/version.json
          curl --fail --silent --show-error "$PRODUCTION_URL/contracts/status" | tee /tmp/contracts.json
          curl --fail --silent --show-error "$PRODUCTION_URL/api/auth/status" | tee /tmp/auth-status.json
          curl --fail --silent --show-error "$PRODUCTION_URL/v1/integrations/status" | tee /tmp/integrations-status.json
          node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const version = JSON.parse(fs.readFileSync('/tmp/version.json', 'utf8'));
          const contracts = JSON.parse(fs.readFileSync('/tmp/contracts.json', 'utf8'));
          const auth = JSON.parse(fs.readFileSync('/tmp/auth-status.json', 'utf8'));
          const integrations = JSON.parse(fs.readFileSync('/tmp/integrations-status.json', 'utf8'));
          if (health.appName !== 'ai-platform-core' || health.status !== 'ok') throw new Error('Production health check failed');
          if (version.appName !== 'ai-platform-core') throw new Error('Production version check failed');
          if (contracts.appName !== 'ai-platform-core' || contracts.status === 'error' || contracts.professionalIdRequired !== false) throw new Error('Production contract check failed');
          if (contracts.authenticationContract?.status !== 'mvp_scoped_headers') throw new Error('Production authentication contract check failed');
          if (auth.status !== 'success' || auth.authorizationMode !== 'mvp_scoped_headers' || auth.professionalIdRequired !== false) throw new Error('Production auth status check failed');
          if (integrations.appName !== 'ai-platform-core' || integrations.status !== 'success' || integrations.professionalIdRequired !== false) throw new Error('Production integration status check failed');
          if (!integrations.sourceOfTruth?.includes('AI Activity') || !integrations.sourceOfTruth?.includes('AI Usage') || !integrations.sourceOfTruth?.includes('AI Capability')) throw new Error('Production integration source-of-truth check failed');
          if (!integrations.notSourceOfTruth?.includes('Customer') || !integrations.notSourceOfTruth?.includes('Payment') || !integrations.notSourceOfTruth?.includes('MessageDraft')) throw new Error('Production integration ownership boundary check failed');
          const apps = new Map((integrations.apps ?? []).map((app) => [app.appName, app]));
          if (!apps.get('communication-planner')?.capabilities?.includes('communication.reply.generate')) throw new Error('Production Communication Planner capability check failed');
          if (!apps.get('velvet')?.sourceOfTruth?.includes('MessageDraft')) throw new Error('Production Velvet MessageDraft boundary check failed');
          if (!apps.get('growth-engine')?.sourceOfTruth?.includes('Payment')) throw new Error('Production Growth Engine ownership check failed');
          NODE
      - name: Verify production D1 persistence
        run: |
          curl --fail --silent --show-error "$PRODUCTION_URL/api/persistence/status" | tee /tmp/persistence.json
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/api/persistence/roundtrip" | tee /tmp/roundtrip.json
          node - <<'NODE'
          const fs = require('node:fs');
          const persistence = JSON.parse(fs.readFileSync('/tmp/persistence.json', 'utf8'));
          const roundtrip = JSON.parse(fs.readFileSync('/tmp/roundtrip.json', 'utf8'));
          if (persistence.status !== 'success' || persistence.data?.driver !== 'd1' || persistence.data?.d1Reachable !== true || persistence.data?.databaseBackedPersistenceReady !== true) throw new Error('Production D1 readiness check failed');
          if (roundtrip.status !== 'success' || roundtrip.data?.persistenceDriver !== 'd1' || roundtrip.data?.roundtripReady !== true) throw new Error('Production D1 roundtrip check failed');
          NODE
      - name: Verify production Event persistence
        run: |
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CLIENT="production-e2e"
          WORKSPACE="ws-event-${RUN_ID}"
          USER="user-event-${RUN_ID}"
          curl --fail --silent --show-error "$PRODUCTION_URL/v1/events/status" | tee /tmp/event-status.json
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/v1/events/roundtrip?client=$CLIENT&workspaceId=$WORKSPACE&userId=$USER" -H "x-client-id: $CLIENT" -H "x-workspace-id: $WORKSPACE" -H "x-user-id: $USER" -H "x-trace-id: trace-event-${RUN_ID}" -H "x-correlation-id: corr-event-${RUN_ID}" | tee /tmp/event-roundtrip.json
          node - <<'NODE'
          const fs = require('node:fs');
          const status = JSON.parse(fs.readFileSync('/tmp/event-status.json', 'utf8'));
          const roundtrip = JSON.parse(fs.readFileSync('/tmp/event-roundtrip.json', 'utf8'));
          if (status.appName !== 'ai-platform-core' || status.domain !== 'event' || status.status !== 'success' || status.sourceOfTruth !== true || status.eventStoreReachable !== true) throw new Error('Production Event status check failed');
          if (roundtrip.ok !== true || roundtrip.status !== 'success' || roundtrip.eventName !== 'ai.activity.created.v1' || roundtrip.persisted !== true) throw new Error('Production Event roundtrip check failed');
          if (!String(roundtrip.traceId).startsWith('trace-event-') || !String(roundtrip.correlationId).startsWith('corr-event-')) throw new Error('Production Event trace/correlation check failed');
          NODE
      - name: Verify production Activity and Usage persistence
        run: |
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CLIENT="production-e2e"
          WORKSPACE_A="ws-e2e-a-${RUN_ID}"
          WORKSPACE_B="ws-e2e-b-${RUN_ID}"
          USER_A="user-a-${RUN_ID}"
          USER_B="user-b-${RUN_ID}"
          cat >/tmp/activity-a.json <<EOF
          {"auth":{"clientId":"$CLIENT","permissions":[]},"activity":{"client":"$CLIENT","workspaceId":"$WORKSPACE_A","userId":"$USER_A","capability":"production.echo","goal":"Production D1 E2E A","context":{},"input":{"runId":"$RUN_ID"}},"messages":[{"role":"user","content":"Production E2E A"}]}
          EOF
          cat >/tmp/activity-b.json <<EOF
          {"auth":{"clientId":"$CLIENT","permissions":[]},"activity":{"client":"$CLIENT","workspaceId":"$WORKSPACE_B","userId":"$USER_B","capability":"production.echo","goal":"Production D1 E2E B","context":{},"input":{"runId":"$RUN_ID"}},"messages":[{"role":"user","content":"Production E2E B"}]}
          EOF
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/v1/gateway/run" -H 'content-type: application/json' --data-binary @/tmp/activity-a.json | tee /tmp/activity-a-result.json
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/v1/gateway/run" -H 'content-type: application/json' --data-binary @/tmp/activity-b.json | tee /tmp/activity-b-result.json
          node - <<'NODE'
          const fs=require('node:fs');
          for(const name of ['a','b']){const value=JSON.parse(fs.readFileSync(`/tmp/activity-${name}-result.json`,'utf8'));if(value.ok!==true||typeof value.result?.activityId!=='string')throw new Error(`Production Activity ${name} failed`);fs.writeFileSync(`/tmp/activity-${name}-id`,value.result.activityId);}
          NODE
          ACTIVITY_A="$(cat /tmp/activity-a-id)"
          ACTIVITY_B="$(cat /tmp/activity-b-id)"
          curl --fail --silent --show-error "$PRODUCTION_URL/v1/activities/$ACTIVITY_A?client=$CLIENT&workspaceId=$WORKSPACE_A&userId=$USER_A" -H "x-client-id: $CLIENT" -H "x-workspace-id: $WORKSPACE_A" -H "x-user-id: $USER_A" | tee /tmp/activity-a-read.json
          curl --fail --silent --show-error "$PRODUCTION_URL/v1/activities/$ACTIVITY_B?client=$CLIENT&workspaceId=$WORKSPACE_B&userId=$USER_B" -H "x-client-id: $CLIENT" -H "x-workspace-id: $WORKSPACE_B" -H "x-user-id: $USER_B" | tee /tmp/activity-b-read.json
          curl --fail --silent --show-error "$PRODUCTION_URL/v1/analytics/usage?client=$CLIENT&workspaceId=$WORKSPACE_A&userId=$USER_A&period=all" -H "x-client-id: $CLIENT" -H "x-workspace-id: $WORKSPACE_A" -H "x-user-id: $USER_A" | tee /tmp/usage-a.json
          curl --fail --silent --show-error "$PRODUCTION_URL/v1/analytics/usage?client=$CLIENT&workspaceId=$WORKSPACE_B&userId=$USER_B&period=all" -H "x-client-id: $CLIENT" -H "x-workspace-id: $WORKSPACE_B" -H "x-user-id: $USER_B" | tee /tmp/usage-b.json
          cat >/tmp/outcome-a.json <<EOF
          {"result":"production_e2e_completed","score":0.95}
          EOF
          cat >/tmp/feedback-a.json <<EOF
          {"rating":5,"edited":false,"accepted":true}
          EOF
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/v1/activities/$ACTIVITY_A/outcome?client=$CLIENT&workspaceId=$WORKSPACE_A&userId=$USER_A" -H 'content-type: application/json' -H "x-client-id: $CLIENT" -H "x-workspace-id: $WORKSPACE_A" -H "x-user-id: $USER_A" --data-binary @/tmp/outcome-a.json | tee /tmp/outcome-a-result.json
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/v1/activities/$ACTIVITY_A/feedback?client=$CLIENT&workspaceId=$WORKSPACE_A&userId=$USER_A" -H 'content-type: application/json' -H "x-client-id: $CLIENT" -H "x-workspace-id: $WORKSPACE_A" -H "x-user-id: $USER_A" --data-binary @/tmp/feedback-a.json | tee /tmp/feedback-a-result.json
          curl --fail --silent --show-error "$PRODUCTION_URL/v1/dashboard/usage?client=$CLIENT&workspaceId=$WORKSPACE_A&userId=$USER_A&period=all" -H "x-client-id: $CLIENT" -H "x-workspace-id: $WORKSPACE_A" -H "x-user-id: $USER_A" | tee /tmp/dashboard-a.json
          PROMPT_ID="production.prompt.${RUN_ID}"
          cat >/tmp/prompt-template.json <<EOF
          {"id":"$PROMPT_ID","version":1,"body":"Production prompt {{name}}","retention":"metadata"}
          EOF
          cat >/tmp/prompt-render.json <<EOF
          {"templateId":"$PROMPT_ID","variables":{"name":"A"}}
          EOF
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/v1/prompt-templates?client=$CLIENT" -H 'content-type: application/json' -H "x-client-id: $CLIENT" --data-binary @/tmp/prompt-template.json | tee /tmp/prompt-template-result.json
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/v1/prompt-templates/render?client=$CLIENT" -H 'content-type: application/json' -H "x-client-id: $CLIENT" --data-binary @/tmp/prompt-render.json | tee /tmp/prompt-render-result.json
          node - <<'NODE'
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('/tmp/activity-a-read.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/activity-b-read.json','utf8'));
          const ua=JSON.parse(fs.readFileSync('/tmp/usage-a.json','utf8'));
          const ub=JSON.parse(fs.readFileSync('/tmp/usage-b.json','utf8'));
          const outcome=JSON.parse(fs.readFileSync('/tmp/outcome-a-result.json','utf8'));
          const feedback=JSON.parse(fs.readFileSync('/tmp/feedback-a-result.json','utf8'));
          const dashboard=JSON.parse(fs.readFileSync('/tmp/dashboard-a.json','utf8'));
          const promptTemplate=JSON.parse(fs.readFileSync('/tmp/prompt-template-result.json','utf8'));
          const promptRender=JSON.parse(fs.readFileSync('/tmp/prompt-render-result.json','utf8'));
          if(a.ok!==true||b.ok!==true)throw new Error('Persisted Activity read failed');
          if(a.activity?.workspaceId===b.activity?.workspaceId||a.activity?.userId===b.activity?.userId)throw new Error('Workspace/user E2E scopes were not distinct');
          if(ua.ok!==true||ua.summary?.usageCount<1||ub.ok!==true||ub.summary?.usageCount<1)throw new Error('Persisted Usage read failed');
          if(outcome.ok!==true||feedback.ok!==true)throw new Error('Persisted Outcome/Feedback write failed');
          if(dashboard.ok!==true||dashboard.view?.metric?.outcomeCount<1||dashboard.view?.metric?.feedbackCount<1)throw new Error('Persisted Outcome/Feedback dashboard read failed');
          if(promptTemplate.ok!==true||promptRender.ok!==true||promptRender.prompt?.rendered!=='Production prompt A')throw new Error('Persisted Prompt Template render failed');
          NODE
      - name: Verify production workspace and user isolation
        run: |
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CLIENT="production-e2e"
          WORKSPACE_A="ws-e2e-a-${RUN_ID}"
          WORKSPACE_B="ws-e2e-b-${RUN_ID}"
          USER_A="user-a-${RUN_ID}"
          USER_B="user-b-${RUN_ID}"
          ACTIVITY_A="$(cat /tmp/activity-a-id)"
          STATUS=$(curl --silent --output /tmp/cross-scope.json --write-out '%{http_code}' "$PRODUCTION_URL/v1/activities/$ACTIVITY_A?client=$CLIENT&workspaceId=$WORKSPACE_B&userId=$USER_B" -H "x-client-id: $CLIENT" -H "x-workspace-id: $WORKSPACE_B" -H "x-user-id: $USER_B")
          test "$STATUS" = "404"
          STATUS=$(curl --silent --output /tmp/header-scope.json --write-out '%{http_code}' "$PRODUCTION_URL/v1/analytics/usage?client=$CLIENT&workspaceId=$WORKSPACE_A&userId=$USER_A&period=all" -H "x-client-id: $CLIENT" -H "x-workspace-id: $WORKSPACE_B" -H "x-user-id: $USER_A")
          test "$STATUS" = "403"
          curl --fail --silent --show-error "$PRODUCTION_URL/v1/analytics/usage?client=$CLIENT&workspaceId=$WORKSPACE_A&userId=$USER_A&period=all" -H "x-client-id: $CLIENT" -H "x-workspace-id: $WORKSPACE_A" -H "x-user-id: $USER_A" | tee /tmp/isolated-usage.json
          node - <<'NODE'
          const fs=require('node:fs');
          const usage=JSON.parse(fs.readFileSync('/tmp/isolated-usage.json','utf8'));
          if(usage.ok!==true||usage.summary?.usageCount!==1)throw new Error('Workspace/user Usage isolation failed');
          NODE

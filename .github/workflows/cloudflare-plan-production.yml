name: Cloudflare Production - Plan APIs

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  D1_DATABASE_ID: ${{ secrets.AI_PLATFORM_CORE_D1_DATABASE_ID }}
  PRODUCTION_URL: https://ai-platform-core.karukimori.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Require Cloudflare configuration
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$D1_DATABASE_ID"
      - name: Generate production Wrangler config
        working-directory: apps/cloudflare-worker
        run: |
          cat > wrangler.toml <<EOF
          name = "ai-platform-core"
          main = "src/entry.ts"
          compatibility_date = "2026-08-24"
          compatibility_flags = ["nodejs_compat"]
          [[d1_databases]]
          binding = "DB"
          database_name = "ai-platform-core"
          database_id = "$D1_DATABASE_ID"
          EOF
      - name: Apply D1 schema
        working-directory: apps/cloudflare-worker
        run: pnpm exec wrangler d1 execute ai-platform-core --remote --file=../../cloudflare/schema.sql --yes
      - name: Deploy Worker
        working-directory: apps/cloudflare-worker
        run: pnpm exec wrangler deploy
      - name: Verify production Plan APIs
        shell: bash
        run: |
          set -euo pipefail
          fetch_json() {
            local url="$1"
            local out="$2"
            local headers=("${@:3}")
            for attempt in {1..10}; do
              code=$(curl --silent --show-error --output "$out" --write-out "%{http_code}" "${headers[@]}" "$url" || true)
              if [ "$code" = "200" ]; then
                return 0
              fi
              echo "Attempt $attempt: HTTP $code from $url"
              sleep 3
            done
            cat "$out" || true
            return 1
          }

          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          APP="numeria-studio"
          WORKSPACE="ws-plan-${RUN_ID}"
          USER="user-plan-${RUN_ID}"
          PLAN="free"
          FEATURE="studio.report.ai_assist"
          QUERY="appId=$APP&workspaceId=$WORKSPACE&userId=$USER&planId=$PLAN&featureKey=$FEATURE"
          HEADERS=(-H "x-client-id: $APP" -H "x-workspace-id: $WORKSPACE" -H "x-user-id: $USER")

          fetch_json "$PRODUCTION_URL/health" /tmp/health.json
          fetch_json "$PRODUCTION_URL/v1/usage?$QUERY" /tmp/plan-usage.json "${HEADERS[@]}"
          fetch_json "$PRODUCTION_URL/v1/entitlements?$QUERY" /tmp/entitlement.json "${HEADERS[@]}"

          node - <<'NODE'
          const fs = require('node:fs');
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const health = read('/tmp/health.json');
          const usage = read('/tmp/plan-usage.json');
          const entitlement = read('/tmp/entitlement.json');
          if (health.appName !== 'ai-platform-core' || health.status !== 'ok') throw new Error('Production health failed');
          if (usage.status !== 'success' || usage.currentPlan !== 'free' || usage.featureKey !== 'studio.report.ai_assist' || usage.limit !== 20) throw new Error('Production plan usage check failed');
          if (entitlement.status !== 'success' || entitlement.planId !== 'free' || entitlement.featureKey !== 'studio.report.ai_assist' || entitlement.allowed !== true || entitlement.limit !== 20) throw new Error('Production entitlement check failed');
          NODE
